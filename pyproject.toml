[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppi-pathways"
version = "2.0.0"
description = "Planetary pressure and socio-economic pathways across countries, 1990–2023"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sahil" }]
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "jupyter", "nbconvert"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
