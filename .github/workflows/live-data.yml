name: Live data

# Refreshes docs/data/live.json, the study site's provisional "latest data" layer.
# The thesis results are fixed to data/thesis_dataset.xlsx and are never touched by this job.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/fetch_live.py
      - .github/workflows/live-data.yml

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest World Bank data and place it on the thesis scale
        run: python tools/fetch_live.py
      - name: Commit if the data changed
        run: |
          if git diff --quiet -- docs/data/live.json && git ls-files --error-unmatch docs/data/live.json >/dev/null 2>&1; then
            echo "No change."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/live.json
          git commit -m "Live data: refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
